# ────────────────────────────────────────────────────────────────
# Deny Common Attack Vectors
# ────────────────────────────────────────────────────────────────

# Block access to sensitive files
location ~* /(\.git|\.env|\.svn|config\.yaml|settings\.json|composer\.json|package\.json|yarn\.lock) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Block access to backup/config files
location ~* \.(bak|backup|old|orig|swp|sql|dump|log|conf)$ {
    deny all;
    return 404;
}

# Block access to PHP (not used, but defense in depth)
location ~* \.php$ {
    deny all;
    return 404;
}

# Block common scanning paths
location ~* /(admin|wp-admin|wp-content|wp-includes|xmlrpc\.php|cgi-bin|shell|cmd|debug|install|setup) {
    deny all;
    access_log off;
    return 404;
}

