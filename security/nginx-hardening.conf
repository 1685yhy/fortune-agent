# ===============================================================
# Nginx Hardening Configuration — 易理明灯 Fortune Agent
# ===============================================================
# Place this file in /etc/nginx/conf.d/security.conf
# or include it from your site configuration.
#
# Apply with: sudo nginx -t && sudo systemctl reload nginx
# ===============================================================

# ────────────────────────────────────────────────────────────────
# Rate Limiting Zones
# ────────────────────────────────────────────────────────────────

# Define rate limiting zones (shared memory)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=analysis_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Stricter limits for sensitive endpoints
limit_req_zone $binary_remote_addr zone=export_limit:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=delete_limit:10m rate=3r/m;

# Per-user rate limiting (requires $http_x_user_id to be set)
limit_req_zone $http_x_user_id zone=user_limit:10m rate=100r/hr;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ────────────────────────────────────────────────────────────────
# Security Headers
# ────────────────────────────────────────────────────────────────

# Hide nginx version from response headers
server_tokens off;

# Default security headers (applied to all responses)
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy (restrict browser features)
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;

# Content Security Policy
# Restrict script sources to prevent XSS
add_header Content-Security-Policy "
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://res.wx.qq.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    img-src 'self' data: https:;
    font-src 'self' https://fonts.gstatic.com;
    connect-src 'self' https://api.weixin.qq.com https://api.deepseek.com;
    frame-src 'none';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
" always;

# Strict Transport Security (HTTPS enforcement)
# 31536000s = 1 year; includeSubDomains applies to all subdomains
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ────────────────────────────────────────────────────────────────
# Request Size Limits
# ────────────────────────────────────────────────────────────────

# Maximum body size (prevents large payload attacks)
client_max_body_size 10M;

# Buffer size for reading client request body
client_body_buffer_size 128k;

# Buffer size for reading client request header
client_header_buffer_size 1k;

# Maximum number and size of large client headers
large_client_header_buffers 4 8k;

# ────────────────────────────────────────────────────────────────
# Timeout Settings
# ────────────────────────────────────────────────────────────────

# Reduce timeouts to prevent slow DoS attacks
client_body_timeout 12s;
client_header_timeout 12s;
send_timeout 10s;
keepalive_timeout 15s;
keepalive_requests 100;

# ────────────────────────────────────────────────────────────────
# SSL/TLS Settings (apply only to HTTPS server blocks)
# ────────────────────────────────────────────────────────────────

# Modern TLS configuration (reject outdated protocols)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

# SSL session settings
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP Stapling
ssl_stapling on;
ssl_stapling_verify on;
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# DH parameters (generate with: openssl dhparam -out /etc/nginx/dhparam.pem 2048)
# ssl_dhparam /etc/nginx/dhparam.pem;

# ────────────────────────────────────────────────────────────────
# Logging
# ────────────────────────────────────────────────────────────────

# Custom log format including security-relevant fields
log_format security '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time '
                    '$limit_req_status';

# Separate access log for security monitoring
access_log /var/log/nginx/fortune-access.log security;
error_log /var/log/nginx/fortune-error.log warn;

