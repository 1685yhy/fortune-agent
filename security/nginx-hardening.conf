# ────────────────────────────────────────────────────────────────
# Request Validation
# ────────────────────────────────────────────────────────────────

# Reject requests with null bytes
if ($request_uri ~* "\x00") {
    return 400;
}

# Reject requests with suspicious user agents
if ($http_user_agent ~* (sqlmap|nikto|nessus|openvas|acunetix|burpsuite|nmap|masscan|zgrab)) {
    return 403;
}

# Block requests without a User-Agent header (common for scanners)
if ($http_user_agent = "") {
    return 403;
}
